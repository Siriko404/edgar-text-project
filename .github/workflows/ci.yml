name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Format check with black
      run: |
        black --check .

    - name: Test with pytest
      env:
        # Mock environment variables for testing
        SEC_API_KEY: test_sec_api_key
        STRIPE_SECRET_KEY: sk_test_mock_stripe_key
        STRIPE_PRICE_ID: price_mock_price_id
        STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term-missing -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security checks with bandit
      run: |
        bandit -r . -x .venv/,tests/ --format json -o bandit-report.json || true
        bandit -r . -x .venv/,tests/ --severity-level medium

    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify application starts
      env:
        SEC_API_KEY: test_sec_api_key
        STRIPE_SECRET_KEY: sk_test_mock_stripe_key
        STRIPE_PRICE_ID: price_mock_price_id
        STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret
      run: |
        # Start the application in background and test if it responds
        timeout 30s uvicorn api:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/ || exit 1

    - name: Build success notification
      run: |
        echo "✅ Build completed successfully!"
        echo "📊 Coverage report generated"
        echo "🔒 Security checks passed"
        echo "🚀 Application verified"